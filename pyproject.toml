[project]
name = "atp-python"
version = "0.2.0"
description = "Agent Trust Protocol (ATP) SDK"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.22.1",
    "base58==2.1.1",
    "httpx==0.28.1",
    "pynacl==1.6.2",
    "python-dotenv==1.2.3",
    "pydantic==2.13.4",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except Exception as e:",
    "except Exception:",
    "logger.error",
    "logger.warning",
    "logger.debug",
]

